<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viedeň – byty v nových štvrtiach</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f7f4; --ink:#1d2a2e; --accent:#0f6b6f; --pin:#d4572a; --line:#d9ddd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161d1f; --ink:#e8ece9; --accent:#5fc3c7; --pin:#ff8a5c; --line:#2b3739; } }
  html, body { height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  body { display:flex; flex-direction:column; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; }
  #status { font-size:.85rem; opacity:.75; }
  #map { flex:1; }
  .leaflet-popup-content { font-size:.9rem; line-height:1.4; color:#1d2a2e; }
  .leaflet-popup-content a { color:#0f6b6f; font-weight:600; }
  .pin { width:14px; height:14px; border-radius:50%; background:#8a9a9b; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .pin.near { width:18px; height:18px; background:#e6a100; }
  .pin.in { width:22px; height:22px; background:#d4572a; }
  .legend { font-size:.8rem; opacity:.85; display:flex; align-items:center; gap:4px; }
  .legend .d { width:10px; height:10px; border-radius:50%; display:inline-block; margin-left:8px; }
  .legend .in { background:#d4572a; } .legend .near { background:#e6a100; } .legend .far { background:#8a9a9b; } .legend .ap { background:#fff; border:2px dashed #5b6b6e; box-sizing:border-box; }
  .pin.approx { background:#fff; border:2px dashed #5b6b6e; }
  .poi-panel { background:rgba(255,255,255,.95); color:#1d2a2e; padding:8px 10px; border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.3); font-size:.85rem; line-height:1.7; }
  .poi-panel b { display:block; margin-bottom:2px; }
  .poi-panel label { display:flex; align-items:center; gap:6px; }
  .poi-panel i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .poi-panel small { display:block; opacity:.7; line-height:1.3; margin-top:4px; max-width:190px; }
  .tag { display:inline-block; padding:0 6px; border-radius:8px; font-size:.75rem; background:#dfeee0; color:#1d4d27; }
</style>
</head>
<body>
<header>
  <h1>Viedeň – byty od 3 izieb do 430 000 €</h1>
  <span id="status">Načítavam…</span>
  <label style="font-size:.85rem"><input type="checkbox" id="onlyFree"> len potvrdený voľný prenájom</label>
  <span class="legend"><i class="d in"></i>vo štvrti <i class="d near"></i>do 1,5 km <i class="d far"></i>ostatné <i class="d ap"></i>približná poloha</span>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Doplň vlastné hodnoty (anon kľúč je určený na verejné použitie, chráni ho RLS politika)
  const SUPABASE_URL = "https://oscvjsereorwihymgthk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zY3Zqc2VyZW9yd2loeW1ndGhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzUyNTQsImV4cCI6MjEwNDgxMTI1NH0.CAeK-Q4jNUiW3sBijhSBzSUw1_fc8l0o0dbvmtZ8EpA";

  const map = L.map("map").setView([48.2082, 16.3738], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const status = document.getElementById("status");

  const ZONES = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "Nordbahnviertel", "district": "2. Leopoldstadt", "note": "Nová štvrť na bývalej Nordbahnhof, park Rudolf-Bednar, bývanie + parter"}, "geometry": {"type": "Polygon", "coordinates": [[[16.3895, 48.22], [16.399, 48.2215], [16.403, 48.229], [16.396, 48.231], [16.389, 48.225], [16.3895, 48.22]]]}}, {"type": "Feature", "properties": {"name": "Viertel Zwei / Krieau", "district": "2. Leopoldstadt", "note": "Novostavby pri Prateri, jazierka, U2 Krieau/Stadion"}, "geometry": {"type": "Polygon", "coordinates": [[[16.406, 48.212], [16.422, 48.213], [16.423, 48.22], [16.407, 48.219], [16.406, 48.212]]]}}, {"type": "Feature", "properties": {"name": "Neu Marx / St. Marx", "district": "3. Landstraße", "note": "Mediálne a technologické centrum, nové bývanie, S-Bahn + U3"}, "geometry": {"type": "Polygon", "coordinates": [[[16.4, 48.187], [16.413, 48.188], [16.413, 48.194], [16.401, 48.1935], [16.4, 48.187]]]}}, {"type": "Feature", "properties": {"name": "Sonnwendviertel", "district": "10. Favoriten", "note": "Pri Hauptbahnhof, Helmut-Zilk-Park, moderná architektúra"}, "geometry": {"type": "Polygon", "coordinates": [[[16.37, 48.183], [16.382, 48.1835], [16.383, 48.19], [16.372, 48.189], [16.37, 48.183]]]}}, {"type": "Feature", "properties": {"name": "Biotope City / Wienerberg", "district": "10. Favoriten", "note": "Zelené novostavby, Wienerberg, U6 Wolfganggasse/Altmannsdorf"}, "geometry": {"type": "Polygon", "coordinates": [[[16.333, 48.156], [16.35, 48.156], [16.35, 48.165], [16.333, 48.165], [16.333, 48.156]]]}}, {"type": "Feature", "properties": {"name": "Seestadt Aspern", "district": "22. Donaustadt", "note": "Jazero, U2 Seestadt, plánovaná štvrť s rušným parterom"}, "geometry": {"type": "Polygon", "coordinates": [[[16.495, 48.222], [16.515, 48.222], [16.515, 48.231], [16.495, 48.231], [16.495, 48.222]]]}}]};
  (gj => {
    L.geoJSON(gj, {
      style: { color: "#0f6b6f", weight: 2, fillColor: "#0f6b6f", fillOpacity: .15 },
      onEachFeature: (f, layer) => layer.bindTooltip(
        `<b>${esc(f.properties.name)}</b><br>${esc(f.properties.district)}<br>${esc(f.properties.note)}`, { sticky: true })
    }).addTo(map);
  })(ZONES);

  const mkIcon = z => L.divIcon({ className: "", html: `<div class="pin ${z || ""}"></div>`, iconSize: [22, 22] });
  const layer = L.layerGroup().addTo(map);
  let rows = [];

  function render() {
    layer.clearLayers();
    const onlyFree = document.getElementById("onlyFree").checked;
    const list = rows.filter(p => p.lat && p.lng && (!onlyFree || p.rental === "free"));
    list.sort((a, b) => ({ in: 2, near: 1 }[a.zone_status] || 0) - ({ in: 2, near: 1 }[b.zone_status] || 0));
    list.forEach(p => {
      const price = p.price ? Number(p.price).toLocaleString("sk-SK") + " €" : "cena neuvedená";
      const days = Math.floor((Date.now() - new Date(p.created_at)) / 864e5);
      const where = p.loc_approx ? "poloha len približne (stred PSČ), presná adresa v e-maile chýba" : p.zone_status === "in" ? `vo štvrti ${esc(p.neighborhood)}`
        : p.zone_status === "near" ? `${(p.dist_zone_m / 1000).toFixed(1)} km od štvrte ${esc(p.neighborhood)}` : "";
      const build = [p.build_type, p.build_year].filter(Boolean).join(", ");
      const rent = p.rental === "free" ? '<span class="tag">voľne prenajímateľný</span>' : "prenájom: neuvedené";
      L.marker([p.lat, p.lng], { icon: mkIcon(p.loc_approx ? "approx" : p.zone_status) }).addTo(layer).bindPopup(
        `<b>${esc(p.title)}</b><br><small>zdroj: ${esc(p.source || "willhaben")}</small><br>${where ? where + "<br>" : ""}` +
        `${p.size_m2 ?? "?"} m² · ${p.rooms} izby · ${price}<br>${esc(p.address)}<br>` +
        `${build ? esc(build) + "<br>" : ""}${rent}<br>` +
        `<small>pridané pred ${days} d</small><br><a href="${esc(p.url)}" target="_blank" rel="noopener">Otvoriť inzerát</a>`);
    });
    const nIn = list.filter(p => p.zone_status === "in").length, nNear = list.filter(p => p.zone_status === "near").length;
    status.textContent = list.length ? `${list.length} ponúk (${nIn} vo štvrti, ${nNear} v okolí)` : "Žiadne ponuky pre tento filter.";
  }
  document.getElementById("onlyFree").addEventListener("change", render);

  fetch(`${SUPABASE_URL}/rest/v1/vienna_properties?select=*&order=created_at.desc&limit=1000`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => { rows = data; render(); })
    .catch(e => { status.textContent = "Chyba načítania: " + e.message + " (skontroluj URL, kľúč a RLS politiku)"; });

  // ---------- Vrstvy okolia (OpenStreetMap / Overpass), vypnuté predvolene ----------
  const ARTHOUSE = /filmcasino|votiv|burg ?kino|metro ?kino|top ?kino|gartenbau|schikaneder|admiral|stadtkino|filmhaus|breitenseer|filmarchiv/i;
  const POI = {
    cinema:  { label: "Kiná (★ artové)",  color: "#7b3fa0", q: 'nwr["amenity"="cinema"]',           minZoom: 12 },
    climb:   { label: "Lezecké steny",    color: "#1f77b4", q: 'nwr["sport"="climbing"]',            minZoom: 12 },
    fitness: { label: "Fitness centrá",   color: "#2e8b57", q: 'nwr["leisure"="fitness_centre"]',    minZoom: 13 },
    cafe:    { label: "Kaviarne",         color: "#a0622d", q: 'nwr["amenity"="cafe"]',              minZoom: 14 },
  };
  Object.values(POI).forEach(p => { p.group = L.layerGroup(); p.ids = new Set(); p.on = false; });
  const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
  const poiNote = document.createElement("small");

  async function overpass(query) {
    for (const url of OVERPASS) {
      try {
        const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(query) });
        if (r.ok) return (await r.json()).elements || [];
      } catch (e) { /* skús ďalší server */ }
    }
    throw new Error("Overpass nedostupný");
  }

  async function loadPoi(key) {
    const p = POI[key];
    if (!p.on) return;
    if (map.getZoom() < p.minZoom) { poiNote.textContent = `Pre „${p.label}“ priblíž mapu (zoom ≥ ${p.minZoom}).`; return; }
    poiNote.textContent = "Načítavam…";
    const b = map.getBounds().pad(0.15);
    const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(",");
    try {
      const els = await overpass(`[out:json][timeout:25];(${p.q}(${bbox}););out center tags 600;`);
      els.forEach(el => {
        const id = el.type + el.id;
        const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
        if (p.ids.has(id) || lat == null) return;
        p.ids.add(id);
        const t = el.tags || {}, name = t.name || p.label;
        const art = key === "cinema" && ARTHOUSE.test(name);
        const web = t.website || t["contact:website"];
        L.circleMarker([lat, lng], { radius: art ? 8 : 5, color: "#fff", weight: 1.5, fillColor: p.color, fillOpacity: .9 })
          .bindPopup(`<b>${esc(name)}</b>${art ? " ★" : ""}<br><small>${esc(p.label)}</small>` +
                     (web && /^https?:\/\//.test(web) ? `<br><a href="${esc(web)}" target="_blank" rel="noopener">web</a>` : ""))
          .addTo(p.group);
      });
      poiNote.textContent = "";
    } catch (e) { poiNote.textContent = "Chyba načítania vrstvy."; }
  }

  const panel = L.control({ position: "topright" });
  panel.onAdd = () => {
    const d = L.DomUtil.create("div", "poi-panel");
    d.innerHTML = "<b>Vrstvy okolia</b>" + Object.entries(POI).map(([k, p]) =>
      `<label><input type="checkbox" data-k="${k}"><i style="background:${p.color}"></i>${p.label}</label>`).join("");
    d.appendChild(poiNote);
    L.DomEvent.disableClickPropagation(d);
    d.addEventListener("change", e => {
      const k = e.target.dataset.k, p = POI[k];
      p.on = e.target.checked;
      if (p.on) { p.group.addTo(map); loadPoi(k); } else { map.removeLayer(p.group); poiNote.textContent = ""; }
    });
    return d;
  };
  panel.addTo(map);
  let poiTimer;
  map.on("moveend", () => { clearTimeout(poiTimer); poiTimer = setTimeout(() => Object.keys(POI).forEach(loadPoi), 600); });
</script>
</body>
</html>
